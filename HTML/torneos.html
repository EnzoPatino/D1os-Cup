<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D10S Cup - Torneos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../CSS/base.css">
  <link rel="stylesheet" href="../CSS/torneos.css">
  <link rel="stylesheet" href="../CSS/auth.css">
  <link rel="stylesheet" href="../CSS/profile.css">
  <link rel="stylesheet" href="../CSS/sidebar.css">
  <link rel="stylesheet" href="../CSS/scroll-animations.css">
</head>
<body class="has-sidebar">
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="sidebar-header">
        <img src="../assets/WhatsApp Image 2026-04-07 at 10.10.12 (1).png" alt="D10S Cup" class="sidebar-logo">
        <div class="logo-text"><h2>D10S CUP</h2><span>Torneo de Fútbol</span></div>
      </a>
      <ul class="sidebar-menu">
        <li class="menu-category">Navegación</li>
        <li class="menu-item"><a href="../index.html" class="menu-link"><span>Inicio</span></a></li>
        <li class="menu-item"><a href="torneos.html" class="menu-link active" aria-current="page"><span>Torneos</span></a></li>
        <li class="menu-item"><a href="partidos.html" class="menu-link"><span>Partidos</span></a></li>
        <li class="menu-item"><a href="Resultados.html" class="menu-link"><span>Resultados</span></a></li>
        <li class="menu-item"><a href="productos.html" class="menu-link"><span>Tienda</span></a></li>
        <li class="menu-category">Usuario</li>
        <li class="menu-item"><a href="misCompras.html" class="menu-link"><span>Mis compras / entradas</span></a></li>
        <li class="menu-item"><a href="../index.html" class="menu-link logout-link"><span>Cerrar sesión</span></a></li>
      </ul>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="action-btn mobile-toggle" id="mobile-menu-toggle" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><h1 class="page-title">Torneos</h1></div>
        <div class="topbar-actions"><div class="nav-auth" data-auth-nav aria-label="Sesión de usuario"></div></div>
      </header>
      <div class="container">
    <div class="header">
      <div class="header-left">
        <h2>Torneos disponibles</h2>
      </div>
    </div>

    <div class="top-bar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input id="torneo-search" type="search" placeholder="Buscar torneo..." aria-label="Buscar torneo">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-modalidad="todos" type="button">Todos</button>
        <button class="filter-btn" data-modalidad="futbol_11" type="button">Fútbol 11</button>
        <button class="filter-btn" data-modalidad="futbol_8" type="button">Fútbol 8</button>
        <button class="filter-btn" data-modalidad="futbol_5" type="button">Fútbol 5</button>
      </div>
      <button class="btn-gold" id="new-tournament-button" type="button" hidden><i class="fas fa-plus"></i> Nuevo Torneo</button>
    </div>

    <p id="torneos-status" class="data-status" role="status">Cargando torneos…</p>
    <div class="grid-torneos" id="torneos-grid"></div>
      </div>
    </main>
  </div>

  <dialog class="tournament-dialog" id="new-tournament-dialog">
    <form id="new-tournament-form">
      <h2>Nuevo torneo</h2>
      <label>Nombre<input name="nombre" maxlength="120" required></label>
      <label>Modalidad<select name="modalidad" required><option value="futbol_11">Fútbol 11</option><option value="futbol_8">Fútbol 8</option><option value="futbol_5">Fútbol 5</option></select></label>
      <label>Estado<select name="estado" required><option value="inscripciones_abiertas">Inscripciones abiertas</option><option value="en_curso">En curso</option><option value="finalizado">Finalizado</option></select></label>
      <label>Fecha de inicio<input name="fecha_inicio" type="date"></label>
      <label>Cupo de equipos<input name="cupo_equipos" type="number" min="1" value="16" required></label>
      <label>Premio<input name="premio" maxlength="500"></label>
      <p class="data-status" id="new-tournament-status" role="status"></p>
      <div class="dialog-actions"><button type="button" id="cancel-new-tournament">Cancelar</button><button type="submit" class="btn-gold">Crear torneo</button></div>
    </form>
  </dialog>

  <script type="module" src="../JS/torneos.js"></script>
  <script type="module" src="../JS/auth.js"></script>
  <script src="../JS/sidebar.js" defer></script>
  <script src="../JS/scroll-animations.js" defer></script>
</body>
</html>
