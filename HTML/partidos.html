<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D10S Cup - Partidos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../CSS/base.css">
  <link rel="stylesheet" href="../CSS/partidos.css">
  <link rel="stylesheet" href="../CSS/auth.css">
  <link rel="stylesheet" href="../CSS/sidebar.css">
  <link rel="stylesheet" href="../CSS/scroll-animations.css">
</head>
<body class="has-sidebar">
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="sidebar-header">
        <img src="../assets/WhatsApp Image 2026-04-07 at 10.10.12 (1).png" alt="D10S Cup" class="sidebar-logo">
        <div class="logo-text"><h2>D10S CUP</h2><span>Torneo de Fútbol</span></div>
      </a>
      <ul class="sidebar-menu">
        <li class="menu-category">Navegación</li>
        <li class="menu-item"><a href="../index.html" class="menu-link"><span>Inicio</span></a></li>
        <li class="menu-item"><a href="torneos.html" class="menu-link"><span>Torneos</span></a></li>
        <li class="menu-item"><a href="partidos.html" class="menu-link active" aria-current="page"><span>Partidos</span></a></li>
        <li class="menu-item"><a href="Resultados.html" class="menu-link"><span>Resultados</span></a></li>
        <li class="menu-item"><a href="productos.html" class="menu-link"><span>Tienda</span></a></li>
        <li class="menu-category">Usuario</li>
        <li class="menu-item"><a href="misCompras.html" class="menu-link"><span>Mis compras / entradas</span></a></li>
        <li class="menu-item"><a href="../index.html" class="menu-link logout-link"><span>Cerrar sesión</span></a></li>
      </ul>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="action-btn mobile-toggle" id="mobile-menu-toggle" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">☰</button><h1 class="page-title">Partidos</h1></div>
        <div class="topbar-actions"><div class="nav-auth" data-auth-nav aria-label="Sesión de usuario"></div></div>
      </header>
      <div class="container">
    <div class="header">
      <div class="header-left">
        <h2>Calendario y resultados</h2>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="carousel-prev" style="width:36px;height:36px;border-radius:8px"><i class="fas fa-chevron-left"></i></button>
        <button class="btn-icon" id="carousel-next" style="width:36px;height:36px;border-radius:8px"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>

    <div class="section-title"><i class="fas fa-clock"></i> Próximos Partidos</div>
    <p id="partidos-status" class="data-status" role="status">Cargando partidos…</p>
    <div class="carousel" id="scheduled-matches"></div>

    <div class="calendar-header">
      <h2><i class="fas fa-calendar-alt" style="color:var(--gold)"></i>Fixture Mensual</h2>
      <div class="calendar-nav">
        <button id="cal-prev"><i class="fas fa-chevron-left"></i></button>
        <span id="cal-month"></span>
        <button id="cal-next"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>

    <div class="calendar-grid" id="cal-grid">
      <div class="cal-day-header">Lun</div>
      <div class="cal-day-header">Mar</div>
      <div class="cal-day-header">Mié</div>
      <div class="cal-day-header">Jue</div>
      <div class="cal-day-header">Vie</div>
      <div class="cal-day-header">Sáb</div>
      <div class="cal-day-header">Dom</div>
    </div>
  </div>
    </main>
  </div>

  <script type="module" src="../JS/partidos.js"></script>
  <script type="module" src="../JS/auth.js"></script>
  <script src="../JS/sidebar.js" defer></script>
  <script src="../JS/scroll-animations.js" defer></script>
</body>
</html>
