<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Olvidaste tu contraseña?</title>
    <link rel="stylesheet" href="../CSS/olvidastecontra.css">
</head>
<body>
     <header class="header">
    <div class="logo-container">
      <img src="../assets/WhatsApp Image 2026-04-07 at 10.10.12 (1).png" alt="Logo D10S CUP" class="logo">
      <div class="logo-text">
        <h1>D10S CUP</h1>
        <p>Torneo de Fútbol</p>
      </div>
    </div>
  </header>
  <div class="login-container">
    <div class="login-box">
      <h2>Ingrese su email</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <button type="submit" class="btn-ingresar">Ingresar</button>
      </form>
      <button class="btn-volver" onclick="window.location.href='../index.html'">Volver</button>
    </div>
  </div>
    
</body>
</html>
