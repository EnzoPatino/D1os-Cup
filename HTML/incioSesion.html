<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - D10S CUP</title>
  <link rel="stylesheet" href="../CSS/inicioSesion.css">
  <link rel="stylesheet" href="../CSS/auth.css">
  <link rel="stylesheet" href="../CSS/profile.css">
  <link rel="stylesheet" href="../CSS/scroll-animations.css">
</head>
<body data-auth-route="login">
  <!-- Barra superior con logo -->
  <header class="header">
    <div class="logo-container">
      <img src="../assets/WhatsApp Image 2026-04-07 at 10.10.12 (1).png" alt="Logo D10S CUP" class="logo">
      <div class="logo-text">
        <h1>D10S CUP</h1>
        <p>Torneo de Fútbol</p>
      </div>
    </div>
    <div class="nav-auth" data-auth-nav aria-label="Sesión de usuario"></div>
  </header>

  <!-- Caja de login -->
  <div class="login-container">
    <div class="login-box">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <input type="text" id="email" name="identity" placeholder="Correo o nombre de usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit" class="btn-ingresar">Ingresar</button>
        <p id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></p>
        <a href="olvidastecontra.html" class="forgot">¿Olvidaste tu contraseña?</a>
      </form>
      <button class="btn-volver" onclick="window.location.href='../index.html'">Volver</button>
    </div>
  </div>

  <script type="module" src="../JS/inicioSesion.js"></script>
  <script type="module" src="../JS/auth.js"></script>
  <script src="../JS/scroll-animations.js" defer></script>
</body>
</html>
