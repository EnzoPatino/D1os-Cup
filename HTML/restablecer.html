<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña - D10S CUP</title>
  <link rel="stylesheet" href="../CSS/inicioSesion.css">
  <link rel="stylesheet" href="../CSS/auth.css">
</head>
<body>
  <header class="header">
    <div class="logo-container">
      <img src="../assets/WhatsApp Image 2026-04-07 at 10.10.12 (1).png" alt="Logo D10S CUP" class="logo">
      <div class="logo-text">
        <h1>D10S CUP</h1>
        <p>Torneo de Fútbol</p>
      </div>
    </div>
    <div class="nav-auth" data-auth-nav aria-label="Sesión de usuario"></div>
  </header>

  <main class="login-container">
    <section class="login-box">
      <h2>Nueva contraseña</h2>
      <form id="passwordResetForm">
        <input type="password" id="password" placeholder="Nueva contraseña" minlength="8" autocomplete="new-password" required>
        <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" minlength="8" autocomplete="new-password" required>
        <button type="submit" class="btn-ingresar">Guardar contraseña</button>
        <p id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></p>
      </form>
      <button class="btn-volver" type="button" onclick="window.location.href='../index.html'">Volver al inicio</button>
    </section>
  </main>

  <script type="module" src="../JS/restablecer.js"></script>
  <script type="module" src="../JS/auth.js"></script>
</body>
</html>
